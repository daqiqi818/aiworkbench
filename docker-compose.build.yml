services:
  backend:
    image: beeftv-backend:server
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}

  web:
    image: beeftv-web:server
    build:
      context: .
      dockerfile: Dockerfile

  openmontage-runner:
    image: beeftv-openmontage-runner:server
    build:
      context: .
      dockerfile: openmontage-runner/Dockerfile
