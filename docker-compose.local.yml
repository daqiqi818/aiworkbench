services:
  backend:
    image: beeftv-backend:local
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-}
    environment:
      CANVAS_LOCAL_MODE: "true"
      CANVAS_BACKEND_ADDR: ":8080"
      CANVAS_BACKEND_DATA_DIR: /data
      CANVAS_SHUTDOWN_TIMEOUT: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
      CANVAS_DATABASE_DRIVER: ${CANVAS_DATABASE_DRIVER:-sqlite}
      DATABASE_URL: ${DATABASE_URL:-}
      REDIS_URL: ${REDIS_URL:-}
      CANVAS_WORKER_CONCURRENCY: ${CANVAS_WORKER_CONCURRENCY:-3}
      CANVAS_CHANNEL_CONCURRENCY: ${CANVAS_CHANNEL_CONCURRENCY:-3}
      CANVAS_REGISTRATION_ENABLED: ${CANVAS_REGISTRATION_ENABLED:-false}
      CANVAS_ALLOW_PRIVATE_UPSTREAMS: ${CANVAS_ALLOW_PRIVATE_UPSTREAMS:-false}
      CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS: ${CANVAS_ALLOWED_PRIVATE_UPSTREAM_HOSTS:-}
      CANVAS_CORS_ORIGINS: ${CANVAS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENABLE_PROVIDER_PLUGINS: ${ENABLE_PROVIDER_PLUGINS:-false}
      OPENMONTAGE_RUNNER_URL: http://openmontage-runner:8090
      OPENMONTAGE_RUNNER_TOKEN: ${OPENMONTAGE_RUNNER_TOKEN:-local-development-change-me}
      OPENMONTAGE_SOURCE_BROKER_URL: http://backend:8080
      GIN_MODE: release
    volumes:
      - backend-data:/data
    restart: unless-stopped
    stop_grace_period: ${CANVAS_SHUTDOWN_TIMEOUT:-10m}
    develop:
      watch:
        - action: rebuild
          path: ./backend
          ignore:
            - data/

  web:
    image: beeftv-web:local
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    develop:
      watch:
        - action: rebuild
          path: ./web
          ignore:
            - node_modules/
            - dist/
            - tsconfig.tsbuildinfo
        - action: rebuild
          path: ./Dockerfile
        - action: rebuild
          path: ./nginx.conf
        - action: rebuild
          path: ./VERSION
        - action: rebuild
          path: ./CHANGELOG.md

  openmontage-runner:
    image: beeftv-openmontage-runner:local
    build:
      context: .
      dockerfile: openmontage-runner/Dockerfile
    environment:
      OPENMONTAGE_WORKSPACE_ROOT: /workspaces
      OPENMONTAGE_RUNNER_TOKEN: ${OPENMONTAGE_RUNNER_TOKEN:-local-development-change-me}
    volumes:
      - openmontage-workspaces:/workspaces
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health')"]
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  backend-data:
  openmontage-workspaces:
